[package]
name = "ai-desktop-companion"
version = "0.1.0"
description = "Local, on-demand desktop visual context"
edition = "2021"
rust-version = "1.90"

# Current must finish image preparation inside its 500 ms freshness budget.
# Keep application debug symbols/assertions while optimizing pixel loops and
# codecs. Image resampling uses the dependency's release settings.
[profile.dev.package.ai-desktop-companion]
opt-level = 2

[profile.dev.package.image]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.num-traits]
opt-level = 3

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
base64 = "0.23"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
zeroize = "1"
image = { version = "0.24.9", default-features = false, features = ["jpeg", "png"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
windows = { version = "0.61.3", features = ["Foundation", "Graphics_Capture", "Graphics_DirectX_Direct3D11", "Win32_Foundation", "Win32_System_Com", "Win32_System_Performance", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture"] }
